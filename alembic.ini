# Alembic settings for JobHunt AI. The app applies migrations on start-up (db.database.init_db),
# so you only need this file to write new ones:
#   alembic revision --autogenerate -m "describe the change"
#   alembic upgrade head
# The database URL comes from DATABASE_URL (or .env), not from this file.
[alembic]
script_location = db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
