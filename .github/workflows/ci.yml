name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, so newly published vulnerabilities show up without a push
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit==2.10.1
      # Every pin in both files, without installing the heavy ML stack.
      - run: pip-audit --progress-spinner off --no-deps --disable-pip -r requirements.txt -r requirements-dev.txt
      # Everything the test environment pulls in, including indirect dependencies.
      - run: pip install -r requirements-dev.txt
      - run: pip-audit --progress-spinner off --skip-editable
