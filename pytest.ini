[pytest]
testpaths = tests
markers =
    live: hits real job sites over the network; opt in with `pytest -m live`
    localdata: reads the postings in your own jobhunt.db; opt in with `pytest -m localdata`
# Live and local-data tests never run by default (or in CI). `pytest -m live` overrides this.
addopts = -m "not live and not localdata"
